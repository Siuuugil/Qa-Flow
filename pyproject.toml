[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-flow"
version = "0.1.6"
description = "AI-powered QA automation CLI tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Kim Su-gil", email = "tnrlftmdi@gmail.com"}
]
keywords = ["qa", "automation", "ai", "code-review", "gemini", "claude", "cli"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "click>=8.1.0",
    "anthropic>=0.25.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "flake8>=6.0.0",
    "supabase>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Siuuugil/Qa-Flow"
"Bug Tracker" = "https://github.com/Siuuugil/Qa-Flow/issues"

[project.scripts]
qa-flow = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.yaml"]