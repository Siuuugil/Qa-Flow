[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-flow"
version = "0.1.0"
description = "AI-powered QA automation CLI tool"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "anthropic>=0.25.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.scripts]
qa-flow = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]